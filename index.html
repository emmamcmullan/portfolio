
 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emma McMullan Portfolio</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Top hero section */
  .hero {
    background-color: #ffffff;
    height: 790px;
    display: flex;
    justify-content: center; /* center horizontally */
    align-items: center;     /* center vertically */
  }

  .hero h1 {
    font-family: 'Aileron', sans-serif;
    font-weight: 700;        /* Bold */
    font-size: 152px;
    line-height: 1.4;
    letter-spacing: -0.094em; /* Approximation for -94 letter spacing in px relative to font size */
    color: #222222;
    margin: 0;
  }

  /* Optional: make it responsive for smaller screens */
  @media (max-width: 1200px) {
    .hero h1 {
      font-size: 100px;
    }
  }
  @media (max-width: 768px) {
    .hero h1 {
      font-size: 60px;
      line-height: 1.2;
    }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>emma mcmullan</h1>
</div>

</body>
</html>
